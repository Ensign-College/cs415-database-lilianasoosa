version: "3"
services:
  cs415-ubuntu:
    build: .
    image: image_cs415_ubuntu
    container_name: container_cs415_ubuntu
    restart: always
    stdin_open: true
    tty: true

  cs415-myuser:
    build: ../myuser
    image: image_cs415_myuser
    container_name: container_cs415_myuser
    restart: always
    stdin_open: true
    tty: true
    